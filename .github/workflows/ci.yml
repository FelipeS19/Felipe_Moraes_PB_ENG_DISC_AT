name: Java CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Permissão do gradlew
        run: chmod +x gradlew

      - name: Build e Testes Unitários
        run: ./gradlew clean build

      - name: Gerar relatório Jacoco
        run: ./gradlew jacocoTestReport

      - name: Upload relatório
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: build/reports/

  selenium-tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Permissão do gradlew
        run: chmod +x gradlew

      - name: Instalar Google Chrome e ChromeDriver
        run: |
          sudo apt update
          sudo apt install -y wget unzip xvfb libxi6 libnss3 libatk-bridge2.0-0 libgtk-3-0
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt --fix-broken install -y
          CHROME_VERSION=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+')
          wget https://chromedriver.storage.googleapis.com/$CHROME_VERSION/chromedriver_linux64.zip
          unzip chromedriver_linux64.zip
          sudo mv chromedriver /usr/bin/chromedriver
          sudo chmod +x /usr/bin/chromedriver


      - name: Rodar testes Selenium
        run: ./gradlew test