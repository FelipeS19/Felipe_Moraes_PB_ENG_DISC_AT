name: Java CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: wrapper permissao 
        run: chmod +x gradlew

      - name: Build e Testes
        run: ./gradlew clean build

      - name: relatorio de cobertura
        run: ./gradlew jacocoTestReport

      - name: Upload do relatório
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: build/reports/

  selenium-tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Permissão gradlew
        run: chmod +x gradlew

      - name: Rodar aplicação
        run: |
          ./gradlew bootRun &
          sleep 20

      - name: Rodar testes Selenium
        run: ./gradlew test