name: Java CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Permissão do gradlew
        run: chmod +x gradlew

      - name: Build e testes unitários
        run: ./gradlew clean build

      - name: Gerar relatório Jacoco
        run: ./gradlew jacocoTestReport

      - name: Upload dos relatórios
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: build/reports/


  selenium-tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Permissão do gradlew
        run: chmod +x gradlew

      - name: Rodar testes Selenium
        run: ./gradlew test



  deploy:
    runs-on: ubuntu-latest
    needs: selenium-tests

    environment:
      name: production

    steps:
      - name: Simular deploy
        run: echo "Deploy realizado com sucesso"

      - name: Log deploy
        run: |
          echo "Deploy concluído" >> $GITHUB_STEP_SUMMARY


  post-deploy-test:
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Permissão do gradlew
        run: chmod +x gradlew

      - name: Testes pós-deploy
        run: ./gradlew test