<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{frag/layout :: head('Usuários')}"></head>

<body>

<div th:replace="~{frag/layout :: navbar}"></div>

<div class="container mt-5">

    <div class="glass">

        <h3 class="text-center mb-4">Usuários cadastrados</h3>

        <table class="table table-dark table-hover text-center align-middle">

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Role</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="u : ${users}">
                    <td th:text="${u.id}"></td>
                    <td th:text="${u.username}"></td>
                    <td th:text="${u.role}"></td>
                </tr>

            </tbody>

        </table>
        <a href="/user/new" class="btn btn-success mb-3">
            Novo Usuário
        </a>
    </div>

</div>

</body>
</html>
