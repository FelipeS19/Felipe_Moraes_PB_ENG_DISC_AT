<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{frag/layout :: head('Produtos')}"></head>

<body>

<div th:replace="~{frag/layout :: navbar}"></div>

<div class="container mt-5">

    <div class="glass">
        <h3 class="text-center mb-4">Cadastro de Produtos</h3>
    

        <form th:action="@{/products}" method="post" class="row g-3" th:object="${productForm}">
            <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
                <p th:each="err : ${#fields.errors('*')}" th:text="${err}"></p>
            </div>
            
            <div class="col-md-4">
                <input class="form-control" type="text" th:field="*{name}" name="name" placeholder="Produto">
            </div>

            <div class="col-md-4">
                <input class="form-control" type="number" th:field="*{price}" name="price" placeholder="Preço">
            </div>

            <div class="col-md-4">
                <input class="form-control" type="number" th:field="*{quantity}" name="quantity" placeholder="Quantidade">
            </div>

            <button id="cadbtn" type="submit" class="btn btn-success mt-3">
                Cadastrar
            </button>
        </form>
    </div>

    <div class="glass mt-4">
        <table class="table table-dark table-hover text-center align-middle">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Produto</th>
                    <th>Preço</th>
                    <th>Quantidade</th>
                    <th>Ação</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="p : ${products}">
                    <td th:text="${p.id}"></td>
                    <td th:text="${p.name}"></td>
                    <td th:text="${p.price}"></td>
                    <td th:text="${p.quantity}"></td>
                    <td>
                        <form th:action="@{/products/delete/{id}(id=${p.id})}" method="post">
                            <button class="btn btn-danger btn-sm">Excluir</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
