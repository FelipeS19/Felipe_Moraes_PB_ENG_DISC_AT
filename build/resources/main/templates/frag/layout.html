<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <title th:text="${title}">Quantum System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #dedef5, #aeaee9);
            min-height: 100vh;
            color: #fff;
        }

        .glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .navbar {
            backdrop-filter: blur(10px);
            background: rgba(0,0,0,0.4) !important;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<div th:fragment="navbar">
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Quantum System</a>

                <div class="d-flex gap-2">

                    <a href="/products" class="btn btn-outline-light">Produtos</a>
                    <a href="/user" class="btn btn-outline-light">Usuários</a>

                    <a sec:authorize="isAnonymous()" href="/login" class="btn btn-light">
                        Login
                    </a>

                    <form sec:authorize="isAuthenticated()" action="/logout" method="post">
                        <button class="btn btn-danger">Logout</button>
                    </form>

                </div>
            </div>
        </div>
    </nav>
</div>

</body>
</html>
