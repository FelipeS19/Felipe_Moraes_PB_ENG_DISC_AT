<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{frag/layout :: head('Cadastrar Usuário')}"></head>

<body>

<div th:replace="~{frag/layout :: navbar}"></div>

<div class="container mt-5 d-flex justify-content-center">

    <div class="glass" style="width: 400px;">

        <h3 class="text-center mb-4">Novo Usuário</h3>

        <form th:action="@{/user}" method="post" th:object="${user}">

            <div class="mb-3">
                <input type="text" th:field="*{username}" class="form-control" placeholder="Username">
            </div>

            <div class="mb-3">
                <input type="password" th:field="*{password}" class="form-control" placeholder="Password">
            </div>

            <div class="mb-3">
                <select th:field="*{role}" class="form-control">
                    <option value="ROLE_USER">USER</option>
                    <option value="ROLE_ADMIN">ADMIN</option>
                </select>
            </div>

            <button class="btn btn-success w-100">Salvar</button>

        </form>

    </div>

</div>

</body>
</html>
