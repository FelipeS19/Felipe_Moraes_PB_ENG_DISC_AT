<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{frag/layout :: head('Login')}"></head>

<body>

<div th:replace="~{frag/layout :: navbar}"></div>

<div class="container mt-5 d-flex justify-content-center">

    <div class="glass" style="width: 400px;">

        <h3 class="text-center mb-4">Login</h3>

        <form method="post" action="/login">

            <div class="mb-3">
                <input type="text"
                       name="username"
                       class="form-control"
                       placeholder="Username">
            </div>

            <div class="mb-3">
                <input type="password"
                       name="password"
                       class="form-control"
                       placeholder="Password">
            </div>

            <button id="loginbtn" class="btn btn-primary w-100">
                Entrar
            </button>

        </form>

    </div>

</div>

</body>
</html>
